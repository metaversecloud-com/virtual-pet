# KEDA HTTP add-on scale-to-zero (0<->1) for dev. The interceptor holds the first
# request while the Deployment scales 0->1, then forwards it. The ALB reaches the
# interceptor via vpet0-interceptor-ingress.yaml on the shared sdk-apps ALB group.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: vpet0
spec:
  # >1 host here = scenario "same deployment, multiple URLs" (shared keys).
  hosts:
    - vpet-dev-topia.topia-rtsdk.com
  scaleTargetRef:
    name: vpet0
    kind: Deployment
    apiVersion: apps/v1
    service: vpet0
    port: 80
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 900
